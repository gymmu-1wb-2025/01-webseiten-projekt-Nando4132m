<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Über mich</title>
    <!--wird dem CSS zugeordnet, damit schlussendlich die grid-wrapper funktionieren.-->
    <link rel="stylesheet" href="../style.css">
  </head>
  <!--body der class grid-wrapper zuordnen.-->
  <body class="grid-wrapper">
    <!--header zum style grid-area: header zordnen, bedeutet das der header ganz oben die ganze Zeile bekommt. -->
    <header style="grid-area: header;">
      <!--Haupttitel-->
      <h1>Über mich</h1>
    </header>
    <!--Aside zu der grid area aside zuornen, damit ein Teil der linken seite nur für aside genutzt werden kann.-->
    <aside>
      <!--Navigationsleiste in aside.-->
      <nav style="grid-area: aside">
        <!--Navigationsleiste um zwischen den Unterseiten/ Hauptseite hin und her zu wechseln.-->
        <ul class="navigation">
          <!--Einzelnens Teil, der Link für die Hauptseite.-->
          <li>
            <a href="/index.html">Start</a>
          </li>
          <!--Link für andere Unterseite.-->
          <li>
            <a href="./hobbies.html">Hobbies</a>
          </li>
          <!--Link für andere Unterseite.-->
          <li class="nav-item">
            <a href="./freizeitbeschäftigungen.html">Freizeitbeschäftigungen</a>
          </li>
          <!--Link für andere Unterseite.-->
          <li>
            <a href="./noten.html">Noten</a>
          </li>
        </ul>
      </nav>
      <!--Navigationsleiste, damit auf der Unterseite/ Hauptseite selbst hoch und runter springen kann.-->
      <nav>
        <ul>
          <!--Definiert denn Titel als= Sections-->
          <li>
            <h2>Sections</h2>
          </li>
          <!--Ist der Link, damit man auf die Sections gehen kann. -->
          <li class="nav-item">
            <a href="#ichausführlich">Über mich (Ausführlicher)</a>
          </li>
          <!--Ist der Link, damit man auf die Sections gehen kann. -->
          <li class="nav-item">
            <a href="#warumübermich">Warum über mich</a>
          </li>
          <!--Ist der Link, damit man auf die Sections gehen kann. -->
          <li class="nav-item">
            <a href="#familie">Familie</a>
          </li>
        </ul>
      </nav>
    </aside>
    <!--main wird damit zur grid-area: main zugeordnet. -->
    <main style="grid-area: main;">
      <!--Sections definieren mit (id=), damit der link von Navigationsleiste funktionieren kann.-->
      <section id="ichausführlich">
        <!--Untertitel-->
        <h2>Das bin ich(Ausführlicher):</h2>
      </section>
      <!--Sections definieren mit (id=), damit der link von Navigationsleiste funktionieren kann.-->
      <section id="warumübermich">
        <!--Untertitel-->
        <h2>Warum schreibe ich über mich?</h2>
      </section>
      <!--Sections definieren mit (id=), damit der link von Navigationsleiste funktionieren kann.-->
      <section id="familie">
        <!--Untertitel-->
        <h2>Meine Familie:</h2>
      </section>
    </main>
    <!--footer wird zur grid-area: footer zugeordnet, damit die ganze untere leiste nur footer ist und nicht mit main, etc. vermischt wird.-->
    <footer style="grid-area: footer">Über mich</footer>
  </body>
</html>
